<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Booking Hub" }}</title>
  
  <style>
    /* Global Pink Theme Variables & Resets */
    :root {
      --primary-pink: #ec4899;
      --deep-pink: #db2777;
      --neon-pink: #f43f5e;
      --pink-glow: rgba(236, 72, 153, 0.4);
      --bg-dark: #0f0b15;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(244, 63, 94, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    
    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
      color: #fce7f3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Styles */
    .main-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 8%; background: rgba(15, 11, 21, 0.7);
      backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 100;
    }
    .site-logo {
      font-size: 24px; font-weight: 900; letter-spacing: 2px; text-decoration: none;
      background: linear-gradient(135deg, #f43f5e, #ec4899, #d946ef);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
    }
    .join-card-btn {
      padding: 10px 24px; border-radius: 30px;
      background: linear-gradient(135deg, var(--primary-pink), var(--deep-pink));
      color: #ffffff; text-decoration: none; font-weight: 700; font-size: 14px;
      box-shadow: 0 0 15px var(--pink-glow); transition: all 0.3s ease;
    }
    .join-card-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(236, 72, 153, 0.7); }

    /* Footer Styles */
    .main-footer {
      margin-top: auto; text-align: center; padding: 25px;
      background: rgba(15, 11, 21, 0.9); border-top: 1px solid var(--glass-border);
      font-size: 13px; color: #f472b6;
    }

    /* Main Content Wrapper */
    .content-wrapper { width: 90%; max-width: 1200px; margin: 0 auto; padding: 40px 0; flex: 1; }

    /* Mobile Responsive Fixes */
    @media screen and (max-width: 768px) {
      .main-header { padding: 15px 5%; flex-direction: column; gap: 15px; }
    }
  </style>
  
  <!-- Add any extra CSS from the specific page -->
  {% if page.extra_css %}
    <style>{{ page.extra_css }}</style>
  {% endif %}
</head>
<body>

  <!-- Header Include -->
  <header class="main-header">
    <a href="index.html" class="site-logo">LOGO</a>
    <a href="profile.html" id="userCardBtn" class="join-card-btn">Join / My Card</a>
  </header>

  <!-- Page Content Gets Injected Here -->
  <main class="content-wrapper">
    {{ content }}
  </main>

  <!-- Footer Include -->
  <footer class="main-footer">
    <p>&copy; 2026 Booking Hub. Designed with Pink Neon Aesthetic.</p>
  </footer>

</body>
</html>
